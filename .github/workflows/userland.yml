name: userland

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "phone/**"
      - "shim/**"
      - "tools/build-turnip-ios.sh"
      - "tools/build-m2v-bridge.sh"
      - ".github/workflows/userland.yml"

concurrency:
  group: userland-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect build scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify HEAD~1 >/dev/null 2>&1 && \
               ! git diff --name-only HEAD~1 HEAD | grep -Eq '^(phone/turnip/|phone/metal2/|tools/build-turnip-ios\.sh|tools/build-m2v-bridge\.sh)'; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Xcode and Homebrew tools
        run: |
          DEV_DIR=$(xcode-select -p 2>/dev/null || true)
          if [ -z "$DEV_DIR" ] || [ ! -d "$DEV_DIR" ]; then
            XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1 || true)
            [ -n "$XC" ] || XC=/Applications/Xcode.app
            sudo xcode-select -s "$XC"
            DEV_DIR="$XC/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$DEV_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          brew install llvm lld
          if [ "${{ steps.scope.outputs.full }}" = "true" ]; then
            brew install bison flex ninja gnu-sed pkg-config autoconf automake glslang spirv-tools
            if [ ! -x /opt/homebrew/opt/llvm/bin/llvm-as ]; then
              sudo mkdir -p /opt/homebrew/opt/llvm/bin
              sudo ln -sf "$(brew --prefix llvm)/bin/llvm-as" /opt/homebrew/opt/llvm/bin/llvm-as
            fi
          fi
          chmod +x work/userland/bin/ios-cc tools/*.sh phone/*/*.sh

      - name: Reconstruct shared sweet_a6xx.{c,h} from patches
        run: |
          git init -q work/dxb/xnu
          for p in xnu/patches/0095-*.patch xnu/patches/0105-*.patch xnu/patches/0106-*.patch \
                   xnu/patches/0107-*.patch xnu/patches/0108-*.patch xnu/patches/0109-*.patch \
                   xnu/patches/0111-*.patch xnu/patches/0112-*.patch xnu/patches/0115-*.patch \
                   xnu/patches/0118-*.patch xnu/patches/0125-*.patch xnu/patches/0127-*.patch \
                   xnu/patches/0128-*.patch xnu/patches/0132-*.patch; do
            git -C work/dxb/xnu apply --include='bsd/dev/sweet_a6xx*' "$PWD/$p"
          done
          ls -la work/dxb/xnu/bsd/dev/

      - name: Build wland, gpu/pmem, media/audio, store, phone/tools, and shim Image
        run: |
          sh phone/wifi/build.sh
          sh phone/gpu/build.sh
          sh phone/media/build.sh
          sh phone/audio/build.sh
          sh phone/store/build.sh
          bash phone/tools/build.sh
          (
            set -euo pipefail
            export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
            cd shim && mkdir -p out
            CFLAGS="-O2 -ffreestanding -nostdlib -fno-builtin -fno-pic -fno-pie -mgeneral-regs-only -mstrict-align -fno-stack-protector -fno-asynchronous-unwind-tables -Wall -Wextra"
            SRCS="start.S shim.c console.c log.c util.c mmu.c fdt.c loader.c ufs.c spmi.c sde.c showlog.c diag.c disptest.c gpuprobe.c gpufw.S smmuprobe.c ramlog.c"
            objs=""
            for f in $SRCS; do
              clang --target=aarch64-none-elf $CFLAGS -c "$f" -o "out/${f%.*}.o"
              objs="$objs out/${f%.*}.o"
            done
            abs=$(llvm-readelf -r $(echo "$objs" | sed 's| out/start.o||') | grep -c R_AARCH64_ABS64 || true)
            [ "$abs" = 0 ] || { echo "error: $abs absolute relocations in shim" >&2; exit 1; }
            ld.lld -static -nostdlib -T shim.ld --build-id=none -N $objs -o out/shim.elf
            llvm-objcopy -O binary out/shim.elf out/Image
            end_hex=$(llvm-nm out/shim.elf | awk '$3=="_end"{print $1}')
            python3 -c "f=open('out/Image','r+b'); f.truncate(int('$end_hex',16)); f.close()"
            ls -lh out/Image
          )

      - name: Build Mesa Turnip (libvulkan_freedreno.dylib) for iOS 16 arm64
        if: steps.scope.outputs.full == 'true'
        run: |
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git reference-repos/UniXNU
          mkdir -p work/turnip
          git init -q work/turnip/mesa
          git -C work/turnip/mesa fetch --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git 85fda3b36405bcaea8bffc64aa4f2651dc90770d || \
            git -C work/turnip/mesa fetch --depth 1 https://chromium.googlesource.com/external/gitlab.freedesktop.org/mesa/mesa 85fda3b36405bcaea8bffc64aa4f2651dc90770d
          git -C work/turnip/mesa checkout -q FETCH_HEAD
          python3 - <<'PY'
          import json, os, subprocess
          cfg = json.load(open("reference-repos/UniXNU/scripts/data/adreno-compiler-inputs.json"))
          for rel in cfg["patches"]:
              p = os.path.abspath("reference-repos/UniXNU/" + rel)
              r = subprocess.run(["git", "-C", "work/turnip/mesa", "apply", "--check", p], capture_output=True, text=True)
              if r.returncode == 0:
                  subprocess.run(["git", "-C", "work/turnip/mesa", "apply", p], check=True)
                  print("Applied:", rel)
              else:
                  print("Skipped (not needed for runtime dylib):", rel, r.stderr.strip())
          assert os.path.exists("work/turnip/mesa/src/freedreno/vulkan/tu_knl_darwin.cc"), "tu_knl_darwin.cc missing!"
          PY
          for p in phone/turnip/patches/*.patch; do
            git -C work/turnip/mesa apply "$PWD/$p"
          done
          python3 -m venv work/turnip/venv
          work/turnip/venv/bin/pip install -q meson mako pyyaml packaging
          sh tools/build-turnip-ios.sh ios

      - name: Build metal2vulkan bridge + SweetMetal2.bundle
        if: steps.scope.outputs.full == 'true'
        run: |
          rustup toolchain install 1.98.0 --profile minimal --target aarch64-apple-ios
          git init -q work/metal2vulkan
          git -C work/metal2vulkan fetch --depth 1 https://github.com/steelbrain/metal2vulkan.git 720ef1ce9ae2a2068999a8675717418b9416283e
          git -C work/metal2vulkan checkout -q FETCH_HEAD
          for p in phone/metal2/bridge/patches/*.patch; do
            git -C work/metal2vulkan apply "$PWD/$p"
          done
          sh tools/build-m2v-bridge.sh ios
          sh phone/metal2/build.sh

      - name: Build dash + dropbearmulti + toybox for iOS 16 arm64 SSH shell
        if: steps.scope.outputs.full == 'true'
        continue-on-error: true
        run: |
          mkdir -p work/userland/stage work/userland/src
          CC_IOS="$PWD/work/userland/bin/ios-cc"
          # 1. dash (/bin/sh)
          (
            set -e
            git clone --depth 1 --branch v0.5.12 https://git.kernel.org/pub/scm/utils/dash/dash.git work/userland/src/dash-0.5.12
            cd work/userland/src/dash-0.5.12
            ./autogen.sh
            CC="$CC_IOS" CC_FOR_BUILD=/usr/bin/clang ac_cv_func_strchrnul=no ac_cv_func_stat64=no ac_cv_func_open64=no \
              ./configure --host=aarch64-apple-darwin
            make -j4
            strip -x src/dash
            codesign -f -s - src/dash
            nm -m src/dash | grep "weak external" || true
            cp src/dash ../../stage/dash
          ) || echo "WARN: dash build failed"
          # 2. dropbearmulti (root pubkey SSH server)
          (
            set -e
            curl -sfL https://github.com/mkj/dropbear/archive/refs/tags/DROPBEAR_2024.86.tar.gz | tar xzf - -C work/userland/src
            cd work/userland/src/dropbear-DROPBEAR_2024.86
            cat > localoptions.h <<'EOF'
          #define DROPBEAR_SVR_PASSWORD_AUTH 0
          #define DROPBEAR_SVR_PAM_AUTH 0
          #define DROPBEAR_SVR_PUBKEY_AUTH 1
          #define DROPBEAR_SVR_MULTIUSER 0
          #define DROPBEAR_PATH_SSH_PROGRAM "/var/local/bin/dbclient"
          #define DEFAULT_PATH "/var/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
          EOF
            python3 - <<'PY'
          cs = open("src/common-session.c").read()
          cs = cs.replace("#if !DROPBEAR_SVR_MULTIUSER", "#if 0 /* IOSONPIXEL_SINGLE_ROOT */")
          open("src/common-session.c", "w").write(cs)
          sa = open("src/svr-auth.c").read()
          sa = sa.replace("setusershell();", "goto goodshell; setusershell();")
          open("src/svr-auth.c", "w").write(sa)
          PY
            autoconf && autoheader
            CC="$CC_IOS" ac_cv_func_strchrnul=no ac_cv_func_getpass=yes ac_cv_func_utmpname=no ac_cv_func_utmpxname=no \
              ./configure --host=aarch64-apple-darwin --disable-zlib --disable-syslog --disable-utmp --disable-utmpx --disable-wtmp --disable-wtmpx --disable-pututline --disable-pututxline --disable-lastlog
            make -j4 PROGRAMS="dropbear dbclient dropbearkey scp" MULTI=1
            strip -x dropbearmulti
            codesign -f -s - dropbearmulti
            nm -m dropbearmulti | grep "weak external" || true
            cp dropbearmulti ../../stage/dropbearmulti
          ) || echo "WARN: dropbear build failed"
          # 3. toybox (macos_defconfig, iOS SDK lacks sys/disk.h)
          (
            set -e
            curl -sfL https://github.com/landley/toybox/archive/refs/tags/0.8.11.tar.gz | tar xzf - -C work/userland/src
            cd work/userland/src/toybox-0.8.11
            python3 - <<'PY'
          s = open("lib/portability.c").read()
          s = s.replace("#if defined(__APPLE__)\n#include <sys/disk.h>", "#if 0 && defined(__APPLE__)\n#include <sys/disk.h>")
          open("lib/portability.c", "w").write(s)
          PY
            export PATH="/opt/homebrew/opt/gnu-sed/libexec/gnubin:$PATH"
            HOSTCC=/usr/bin/clang CC="$CC_IOS" make macos_defconfig
            HOSTCC=/usr/bin/clang CC="$CC_IOS" NOSTRIP=1 make -j4 toybox
            strip -x toybox
            codesign -f -s - toybox
            nm -m toybox | grep "weak external" || true
            cp toybox ../../stage/toybox
          ) || echo "WARN: toybox build failed"
          ls -la work/userland/stage

      - name: Package userland bundle
        run: |
          mkdir -p dist-userland/bin dist-userland/Extensions dist-userland/lib dist-userland/HAL dist-userland/Applications
          if [ -d phone/metal2/out/SweetMetal2.bundle ]; then
            cp -R phone/metal2/out/SweetMetal2.bundle dist-userland/Extensions/
          fi
          cp phone/media/out/libsweet_media.dylib phone/media/out/libsweet_sysfix.dylib dist-userland/lib/
          cp -R phone/audio/out/HakiosAudio.driver dist-userland/HAL/
          cp -R phone/store/out/SweetStore.app dist-userland/Applications/
          cp phone/store/out/sweetstored dist-userland/bin/
          cp phone/metal2/out/m2vtest dist-userland/bin/ 2>/dev/null || true
          cp phone/wifi/out/wland dist-userland/bin/
          cp phone/gpu/out/gpu phone/gpu/out/pmem dist-userland/bin/
          cp phone/tools/out/* dist-userland/bin/
          cp work/userland/stage/* dist-userland/bin/ 2>/dev/null || true
          cp shim/out/Image dist-userland/shim-Image
          tar czf ios-userland.tar.gz -C dist-userland .
          ls -lh ios-userland.tar.gz dist-userland/bin dist-userland/Extensions dist-userland/lib dist-userland/HAL dist-userland/Applications

      - uses: actions/upload-artifact@v4
        with:
          name: ios-userland
          path: ios-userland.tar.gz
